<!-- Formulari d'inscripció -->
<section id="formulario" class="container py-5">

    <div class="row justify-content-center">
        <div class="col-12 col-md-8 col-lg-6">

            <h2 class="text-center mb-3">Viu el Ressò</h2>

            <p class="text-center mb-4">
                Inscriu-te a les activitats del festival i forma part
                de l'experiència Ressò.
            </p>

            <form>

                <div class="mb-3">
                    <label for="nom" class="form-label">
                        Nom i cognoms
                    </label>
                    <input type="text" class="form-control"
                        id="nom" name="nom" required>
                </div>

                <div class="mb-3">
                    <label for="email" class="form-label">
                        Correu electrònic
                    </label>
                    <input type="email" class="form-control"
                        id="email" name="email" required>
                </div>

                <div class="mb-3">
                    <label for="activitat" class="form-label">
                        Activitat
                    </label>
                    <select class="form-select" id="activitat"
                        name="activitat" required>
                        <option value="" selected disabled>
                            Tria una activitat
                        </option>
                        <option value="projeccions">
                            Projeccions audiovisuals
                        </option>
                        <option value="concerts">
                            Concerts
                        </option>
                        <option value="tallers">
                            Tallers creatius
                        </option>
                        <option value="xerrades">
                            Xerrades i col·loquis
                        </option>
                    </select>
                </div>

                <div class="mb-3">
                    <label for="missatge" class="form-label">
                        Comentaris (opcional)
                    </label>
                    <textarea class="form-control"
                        id="missatge" name="missatge"
                        rows="3"></textarea>
                </div>

                <div class="form-check mb-4">
                    <input class="form-check-input" type="checkbox"
                        id="privacitat" name="privacitat" required>
                    <label class="form-check-label" for="privacitat">
                        Accepto la política de privacitat.
                    </label>
                </div>

                <div class="text-center">
                    <button type="submit" class="btn btn-dark">
                        Inscriu-m'hi
                    </button>
                </div>

            </form>

        </div>
    </div>

</section>
<!-- Fi formulari d'inscripció -->
